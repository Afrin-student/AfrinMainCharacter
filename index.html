```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    position:relative;
    z-index:5;
}

.box{
    width:100%;
    max-width:850px;
}

.red{color:#ff3155;}
.pink{color:#ff5caa;}
.gold{color:#ffd84d;}

.warning{
    color:#ff3155;
    font-size:16px;
    font-weight:bold;
    letter-spacing:4px;
    animation:blink .8s infinite;
}

.big{
    font-size:42px;
    font-weight:900;
    line-height:1.25;
    margin:20px 0;
    animation:zoom 1s ease;
}

.huge{
    font-size:65px;
    font-weight:900;
    line-height:1.2;
    margin:20px 0;
    text-shadow:0 0 25px #ff3155;
    animation:zoom 1.3s ease;
}

.text{
    font-size:20px;
    line-height:1.8;
    white-space:pre-line;
}

.small{
    color:#999;
    margin-top:20px;
}

button{
    margin-top:30px;
    padding:15px 30px;
    border:2px solid #ff4f8b;
    border-radius:30px;
    background:#111;
    color:#ff6fa7;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff4f8b;
    color:white;
    transform:scale(1.08);
}

/* background glow */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,rgba(255,50,100,.18),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(150,50,255,.15),transparent 30%);
    pointer-events:none;
}

/* stars */

.star{
    position:fixed;
    color:#ff6fa7;
    animation:float 5s linear forwards;
    z-index:1;
}

/* hearts */

.heart{
    position:fixed;
    bottom:-50px;
    font-size:35px;
    animation:heartFly 5s ease-out forwards;
    z-index:20;
}

/* sparkles */

.spark{
    position:fixed;
    font-size:25px;
    animation:sparkBlast 1.5s ease-out forwards;
    z-index:30;
}

/* animations */

@keyframes blink{
    50%{opacity:.2;}
}

@keyframes zoom{
    from{
        opacity:0;
        transform:scale(.4);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes float{
    from{
        transform:translateY(0) rotate(0);
        opacity:1;
    }
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

@keyframes heartFly{
    from{
        transform:translateY(0) scale(.5);
        opacity:0;
    }
    20%{opacity:1;}
    to{
        transform:translateY(-110vh) rotate(25deg) scale(1.5);
        opacity:0;
    }
}

@keyframes sparkBlast{
    from{
        transform:scale(0);
        opacity:1;
    }
    50%{
        transform:scale(2);
        opacity:1;
    }
    to{
        transform:scale(.3);
        opacity:0;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const app=document.getElementById("app");

function wait(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

/* typing effect */

async function typeText(text,speed=35){

    app.innerHTML=`
        <div class="box">
            <div class="text" id="typing"></div>
        </div>
    `;

    const typing=document.getElementById("typing");

    for(const char of text){
        typing.textContent+=char;
        await wait(speed);
    }
}

/* floating stars */

function createStar(){

    const star=document.createElement("div");

    star.className="star";
    star.innerHTML=["✦","✧","✨","★"][Math.floor(Math.random()*4)];

    star.style.left=Math.random()*100+"%";
    star.style.bottom="-30px";
    star.style.fontSize=(15+Math.random()*25)+"px";

    document.body.appendChild(star);

    setTimeout(()=>star.remove(),5000);
}

setInterval(createStar,400);

/* hearts */

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=(Math.random()*90+5)+"%";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),5000);
}

/* final spark blast */

function createSpark(){

    const spark=document.createElement("div");

    spark.className="spark";
    spark.innerHTML=["✨","💥","⭐","🎆","💖"][Math.floor(Math.random()*5)];

    spark.style.left=(Math.random()*85+5)+"%";
    spark.style.top=(Math.random()*70+10)+"%";

    document.body.appendChild(spark);

    setTimeout(()=>spark.remove(),1600);
}

/* START */

async function start(){

    /* INTRO */

    app.innerHTML=`
        <div class="box">

            <div class="warning">
                SYSTEM INITIALIZING...
            </div>

            <div class="huge">
                AFRIN.EXE
            </div>

            <div class="text">

                Loading dreams...
                
                Loading chaos...
                
                Loading main character energy...

    `;

    await wait(3500);

    /* DETECTED */

    app.innerHTML=`
        <div class="box">

            <div class="warning">
                ⚠️ MAIN CHARACTER DETECTED ⚠️
            </div>

            <div class="huge">
                AFRIN 👑
            </div>

            <div class="text">
                Status:
                <span class="pink">UNSTOPPABLE</span>
                
                Common sense:
                <span class="gold">UNDER MAINTENANCE</span>
            </div>

        </div>
    `;

    await wait(3500);

    /* PERSONALITY */

    await typeText(
        "WHO IS AFRIN?\n\n"+
        "Quick learner. ⚡\n"+
        "Movie lover. 🎬\n"+
        "Music lover. 🎧\n"+
        "Book lover. 📚\n"+
        "Food experimenter. 🍜\n\n"+
        "Basically...\n"+
        "one person with approximately\n"+
        "47 different personalities. 😂",
        30
    );

    await wait(3500);

    /* COLLEGE */

    await typeText(
        "THE ACADEMIC ARC 🎓\n\n"+
        "B.Tech — Artificial Intelligence & Data Science\n\n"+
        "Python ✓\n"+
        "C ✓\n"+
        "SQL ✓\n\n"+
        "Projects ✓\n"+
        "Assignments ✓\n"+
        "Last-minute panic ✓✓✓\n\n"+
        "Somehow...\n"+
        "STILL SURVIVING. 💀",
        28
    );

    await wait(3500);

    /* PERSONALITY */

    await typeText(
        "CHARACTER ANALYSIS 🧠\n\n"+
        "Quick learner.\n"+
        "Adapts fast.\n"+
        "Can explain things to friends.\n"+
        "Gets things done when it matters.\n\n"+
        "But when pressure arrives...\n\n"+
        "ANGER.EXE HAS STOPPED RESPONDING. 💀",
        30
    );

    await wait(3500);

    /* DREAMS */

    await typeText(
        "THE REAL GOAL 💫\n\n"+
        "Not just getting a job.\n\n"+
        "Building a life where\n"+
        "she can stand on her own.\n\n"+
        "Earn her own money.\n"+
        "Make her own decisions.\n"+
        "Build her own future.\n\n"+
        "MAIN CHARACTER ENERGY: 100% 🔥",
        30
    );

    await wait(3500);

    /* MOVIE */

    await typeText(
        "OFFICIAL INTERESTS 🎬\n\n"+
        "Movies? YES.\n"+
        "Music? YES.\n"+
        "Books? YES.\n"+
        "Netflix? ABSOLUTELY.\n\n"+
        "Responsibilities first.\n"+
        "Entertainment after.\n\n"+
        "Because apparently...\n"+
        "SHE HAS TO BE RESPONSIBLE TOO. 😭",
        28
    );

    await typeText(

    app.innerHTML=`

            <div class="huge">

}
